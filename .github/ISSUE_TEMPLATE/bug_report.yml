name: Bug Report
description: File a bug report
labels: [bug]
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: Anything that could help us understand what is happening. Include your environment.
    validations:
      required: true

  - type: textarea
    id: expected
    attributes:
      label: Expected behavior
      description: What should have happened.
    validations:
      required: true

  - type: textarea
    id: current
    attributes:
      label: Current behavior
      description: What is happening.
    validations:
      required: true

  - type: textarea
    id: steps
    attributes:
      label: Steps to reproduce
      placeholder: |
        1.
        2.
        3.
        4.
        5.
    validations:
      required: true

  - type: textarea
    id: logs
    attributes:
      label: Logs
      description: If you have access to logs, please add them.

  - type: textarea
    id: comments
    attributes:
      label: Additional comments
