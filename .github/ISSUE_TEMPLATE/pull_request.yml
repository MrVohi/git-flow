name: Pull Request Review Request
description: Open a review request for a pull request
body:
  - type: textarea
    id: context
    attributes:
      label: Context
      description: What does this PR do? What does it fix?
    validations:
      required: true

  - type: textarea
    id: changes
    attributes:
      label: Changes
      description: What does this PR touch in terms of code?
      placeholder: |
        -
        -
        -
    validations:
      required: true

  - type: textarea
    id: impact
    attributes:
      label: Impact
      description: What does this PR change? New env var? Anything we should stop doing?
      placeholder: |
        -
        -
        -

  - type: textarea
    id: how_to_test
    attributes:
      label: How to test
      description: What should we do to test your changes?
      placeholder: "1. ... -> 2. ... -> 3. ..."
    validations:
      required: true

  - type: textarea
    id: poi
    attributes:
      label: Points of Interest
      description: Anything we should pay attention to.
      placeholder: |
        -
